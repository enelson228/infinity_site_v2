{% extends "base.html" %}

{% block title %}OSINT Toolkit{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xl);">

    <!-- Header -->
    <div style="margin-bottom: var(--spacing-xl);">
        <h1 style="font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 0.15em; color: var(--reach-cyan); text-shadow: 0 0 12px rgba(34,211,238,0.4); margin: 0 0 4px 0;">OSINT TOOLKIT</h1>
        <p style="font-family: var(--font-mono); font-size: 0.65rem; color: rgba(34,211,238,0.4); letter-spacing: 0.2em; margin: 0;">// OPEN SOURCE INTELLIGENCE — RECONNAISSANCE & INVESTIGATION</p>
    </div>

    <!-- Tools Grid -->
    <div style="margin-bottom: var(--spacing-xl);">
        <h2 style="font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.15em; color: rgba(34,211,238,0.7); margin: 0 0 var(--spacing-md) 0;">TOP 10 OSINT TOOLS</h2>
    </div>

    <div id="osint-tools-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--spacing-lg);">
        <!-- Tools populated by JS -->
        <div id="osint-tools-loading" style="grid-column: 1 / -1; text-align: center; padding: var(--spacing-xl); color: rgba(34,211,238,0.3); font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;">
            LOADING OSINT TOOLS...
        </div>
    </div>

    <!-- Tools Details Panel -->
    <div id="osint-tools-details" style="margin-top: var(--spacing-lg); padding: var(--spacing-lg); background: rgba(21,25,42,0.85); border: 1px solid rgba(34,211,238,0.15); border-radius: 10px; display: none;">
        <h2 style="font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.15em; color: rgba(34,211,238,0.7); margin: 0 0 var(--spacing-md) 0;">TOOL DETAILS</h2>
        <div id="osint-tools-details-content">
            <!-- Details populated by JS -->
        </div>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const toolsGrid = document.getElementById('osint-tools-grid');
    const loadingEl = document.getElementById('osint-tools-loading');
    const detailsPanel = document.getElementById('osint-tools-details');
    const detailsContent = document.getElementById('osint-tools-details-content');

    // Fetch OSINT tools from API
    fetch('/api/osint/tools')
        .then(response => response.json())
        .then(data => {
            loadingEl.style.display = 'none';
            renderToolsGrid(data.tools);
        })
        .catch(error => {
            loadingEl.textContent = 'Failed to load OSINT tools';
            loadingEl.style.color = 'var(--reach-orange)';
        });

    function renderToolsGrid(tools) {
        toolsGrid.innerHTML = '';
        
        tools.forEach(tool => {
            const card = document.createElement('div');
            card.className = 'osint-tool-card';
            card.style.cssText = 'background: rgba(21,25,42,0.85); border: 1px solid rgba(34,211,238,0.15); border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.2s;';
            card.innerHTML = `
                <div style="padding: var(--spacing-md);">
                    <div style="display: flex; align-items: center; margin-bottom: var(--spacing-sm);">
                        <div style="font-size: 1.5rem; margin-right: var(--spacing-sm); color: var(--reach-cyan);">🔍</div>
                        <div>
                            <h3 style="font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.1em; color: var(--text-primary); margin: 0 0 2px 0;">${tool.name}</h3>
                            <p style="font-family: var(--font-mono); font-size: 0.65rem; color: rgba(34,211,238,0.5); margin: 0;">${tool.category}</p>
                        </div>
                    </div>
                    <p style="font-family: var(--font-mono); font-size: 0.7rem; color: rgba(34,211,238,0.4); line-height: 1.4; margin: 0 0 var(--spacing-md) 0;">${tool.description}</p>
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer"
                       style="display: inline-block; font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.1em; padding: 4px 12px; background: transparent; border: 1px solid var(--reach-cyan); color: var(--reach-cyan); text-decoration: none; transition: all 0.2s;"
                       onmouseover="this.style.background='rgba(34,211,238,0.1)'"
                       onmouseout="this.style.background='transparent'">LAUNCH</a>
                </div>
            `;
            
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-2px)';
                card.style.boxShadow = '0 4px 12px rgba(34,211,238,0.2)';
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
                card.style.boxShadow = 'none';
            });
            
            card.addEventListener('click', () => {
                showToolDetails(tool);
            });
            
            toolsGrid.appendChild(card);
        });
    }

    function showToolDetails(tool) {
        detailsContent.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
                <div>
                    <p style="font-family: var(--font-mono); font-size: 0.65rem; color: rgba(34,211,238,0.3); margin-bottom: 4px;">NAME</p>
                    <p style="font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.1em; color: var(--text-primary);">${tool.name}</p>
                </div>
                <div>
                    <p style="font-family: var(--font-mono); font-size: 0.65rem; color: rgba(34,211,238,0.3); margin-bottom: 4px;">CATEGORY</p>
                    <p style="font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.1em; color: var(--reach-cyan);">${tool.category}</p>
                </div>
            </div>
            <p style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-primary); line-height: 1.5; margin-bottom: var(--spacing-md);">${tool.description}</p>
            <div style="margin-top: var(--spacing-md); padding-top: var(--spacing-md); border-top: 1px solid rgba(34,211,238,0.1);">
                <p style="font-family: var(--font-mono); font-size: 0.65rem; color: rgba(34,211,238,0.3); margin-bottom: 4px;">ACCESS URL</p>
                <a href="${tool.url}" target="_blank" rel="noopener noreferrer"
                   style="display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; padding: 6px 14px; background: transparent; border: 1px solid rgba(34,211,238,0.3); color: rgba(34,211,238,0.6); text-decoration: none;"
                   onmouseover="this.style.background='rgba(34,211,238,0.08)';this.style.color='var(--reach-cyan)'"
                   onmouseout="this.style.background='transparent';this.style.color='rgba(34,211,238,0.6)'">VISIT TOOL</a>
            </div>
        `;
        detailsPanel.style.display = 'block';
    }
});
</script>
{% endblock %}

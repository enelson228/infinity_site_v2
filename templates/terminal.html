{% extends "base.html" %}

{% block title %}INFINITY Terminal{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xl);">
    <div class="terminal-panel">
        <div class="terminal-header">
            <div class="terminal-header-left">
                <span class="terminal-indicator"></span>
                <span class="terminal-title">INFINITY TERMINAL</span>
                <span class="terminal-subtitle">// MJOLNIR ARMORY SYSTEMS</span>
            </div>
            <div class="terminal-vitals">
                <div class="vital-item">CPU: <span id="vital-cpu">--%</span></div>
                <div class="vital-item">RAM: <span id="vital-ram">--%</span></div>
            </div>
            <button class="terminal-logout-btn" id="terminal-logout">LOGOUT</button>
        </div>

        <div class="terminal-output" id="terminal-output"></div>

        <div class="terminal-input-bar">
            <span class="terminal-prompt">INFINITY &gt;</span>
            <input
                type="text"
                id="terminal-input"
                autocomplete="off"
                spellcheck="false"
                placeholder="Type your query..."
            >
            <button id="terminal-send">SEND</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_versioned('js/terminal.js') }}"></script>
{% endblock %}
